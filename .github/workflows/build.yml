name: Build desktop packages

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: version
        name: Resolve A.B.commit-count version
        run: echo "value=$(node scripts/version.cjs)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  package:
    if: github.event_name == 'push'
    needs: test
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            artifact: macos-arm64
          - os: macos-15-intel
            arch: x64
            artifact: macos-x64
          - os: windows-latest
            arch: x64
            artifact: windows-x64
          - os: ubuntu-latest
            arch: x64
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist -- --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: ollama-profiler-${{ needs.test.outputs.version }}-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.exe
            release/*.zip
            release/*.blockmap

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - test
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: ollama-profiler-${{ needs.test.outputs.version }}-*
          merge-multiple: true
          path: release-assets
      - name: Publish GitHub release
        shell: bash
        run: |
          tag="v${{ needs.test.outputs.version }}"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
          else
            gh release create "$tag" release-assets/* \
              -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Ollama Profiler $tag" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
