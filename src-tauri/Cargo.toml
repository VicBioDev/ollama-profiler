[package]
name = "ollama-profiler"
version = "0.1.0"
description = "Lightweight desktop profiler for fleets of Ollama servers"
authors = ["VicBioDev <VicBioDev@users.noreply.github.com>"]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[lib]
name = "ollama_profiler_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
dirs-next = "2"
encoding_rs = "0.8"
flate2 = "1"
futures-util = "0.3"
get_if_addrs = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
thiserror = "2"
tokio = { version = "1", features = ["net", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
